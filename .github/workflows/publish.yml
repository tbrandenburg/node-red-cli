name: Publish

# Runs when a GitHub release is published (see `make release`, which tags
# and creates the release). Uses npm's OIDC "trusted publishing" -- no
# npm token/secret required. `id-token: write` lets GitHub issue a
# short-lived OIDC token that npm exchanges for a scoped publish token
# at publish time.
#
# Bootstrap note: trusted publishing is configured on an *existing*
# package's settings page on npmjs.com (Packages -> node-red-cli ->
# Settings -> Trusted publishing -> GitHub Actions, pointing at this
# repo + this workflow filename). That page doesn't exist until the
# package has been published at least once, so the very first release
# must be published manually (`make publish`, interactive npm login/OTP)
# before trusted publishing can be linked. Until that link is
# configured, this workflow is expected to fail to authenticate.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: make install
      - run: make ci
      - run: npm --version
      - run: npm publish
